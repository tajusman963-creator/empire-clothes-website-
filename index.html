
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M TAJ Cloths</title>

<meta name="description" content="M TAJ Cloths - Quality Clothes at Affordable Prices">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f7f7f7;
    color:#222;
}

/* HEADER */
header{
    background:#111;
    color:white;
    padding:18px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:25px;
    font-weight:bold;
    letter-spacing:1px;
}

.logo span{
    color:#d4af37;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-size:15px;
}

nav a:hover{
    color:#d4af37;
}

/* HERO */
.hero{
    min-height:520px;
    background:linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
    url("https://images.unsplash.com/photo-1445205170230-053b83016050?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    padding:30px;
}

.hero h1{
    font-size:50px;
    margin-bottom:15px;
}

.hero h1 span{
    color:#d4af37;
}

.hero p{
    font-size:20px;
    margin-bottom:25px;
}

.btn{
    display:inline-block;
    background:#d4af37;
    color:#111;
    padding:13px 25px;
    border-radius:5px;
    text-decoration:none;
    font-weight:bold;
    margin:5px;
}

.btn:hover{
    background:#fff;
}

/* SECTION */
.section{
    padding:55px 6%;
}

.section-title{
    text-align:center;
    margin-bottom:35px;
}

.section-title h2{
    font-size:32px;
}

.section-title p{
    color:#666;
    margin-top:8px;
}

/* PRODUCTS */
.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
}

.product{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 3px 15px rgba(0,0,0,.1);
    transition:.3s;
}

.product:hover{
    transform:translateY(-5px);
}

.product img{
    width:100%;
    height:280px;
    object-fit:cover;
}

.product-info{
    padding:18px;
    text-align:center;
}

.product-info h3{
    margin-bottom:8px;
}

.price{
    font-size:21px;
    font-weight:bold;
    color:#c59d20;
    margin:10px 0;
}

.old-price{
    text-decoration:line-through;
    color:#888;
    font-size:15px;
    margin-right:7px;
}

.order-btn{
    display:block;
    background:#111;
    color:white;
    padding:11px;
    text-decoration:none;
    border-radius:5px;
    margin-top:12px;
}

.order-btn:hover{
    background:#d4af37;
    color:#111;
}

/* ABOUT */
.about{
    background:white;
    text-align:center;
}

.about p{
    max-width:750px;
    margin:auto;
    line-height:1.8;
    color:#555;
}

/* CONTACT */
.contact{
    background:#111;
    color:white;
    text-align:center;
}

.contact h2{
    margin-bottom:15px;
}

.contact p{
    margin:8px;
}

.whatsapp{
    display:inline-block;
    margin-top:20px;
    background:#25D366;
    color:white;
    padding:14px 25px;
    border-radius:5px;
    text-decoration:none;
    font-weight:bold;
}

/* FOOTER */
footer{
    background:#050505;
    color:#aaa;
    text-align:center;
    padding:20px;
    font-size:14px;
}

/* MOBILE */
@media(max-width:700px){

    header{
        padding:15px 4%;
    }

    .logo{
        font-size:20px;
    }

    nav a{
        margin-left:8px;
        font-size:12px;
    }

    .hero{
        min-height:450px;
    }

    .hero h1{
        font-size:36px;
    }

    .hero p{
        font-size:16px;
    }

    .section{
        padding:40px 5%;
    }

    .product img{
        height:250px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
    <div class="logo">
        M TAJ <span>Cloths</span>
    </div>

    <nav>
        <a href="#home">Home</a>
        <a href="#products">Products</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
   tle>
